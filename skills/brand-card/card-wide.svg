<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <!-- LinkedIn / X card (1.91:1). Replace every {{...}}; delete lines you do not need. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{BG}}"/>
      <stop offset="1" stop-color="{{BG_2}}"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="230" fill="{{ACCENT}}" opacity="0.14"/>
  <rect x="0" y="0" width="14" height="627" fill="{{ACCENT}}"/>
  <text x="70" y="95" font-family="{{FONT}}" font-size="30" font-weight="700" fill="{{TEXT}}" letter-spacing="2">{{BRAND}}</text>
  <text x="70" y="185" font-family="{{FONT}}" font-size="28" font-weight="600" fill="{{ACCENT}}" letter-spacing="3">{{KICKER}}</text>
  <!-- Title: at most ~24 characters per line at this size, 1–3 lines. -->
  <text font-family="{{FONT}}" font-size="64" font-weight="800" fill="{{TEXT}}">
    <tspan x="70" y="270">{{TITLE_1}}</tspan>
    <tspan x="70" y="350">{{TITLE_2}}</tspan>
    <tspan x="70" y="430">{{TITLE_3}}</tspan>
  </text>
  <text x="70" y="550" font-family="{{FONT}}" font-size="28" fill="{{TEXT}}" opacity="0.8">{{FOOTER}}</text>
  <text x="1130" y="550" font-family="{{FONT}}" font-size="28" font-weight="700" fill="{{ACCENT}}" text-anchor="end">{{CTA}}</text>
</svg>
