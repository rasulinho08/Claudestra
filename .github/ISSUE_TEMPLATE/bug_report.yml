name: Bug report
description: Something does not work as described in the docs.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not paste API keys, tokens or private data. Security problems: use Security → Report a vulnerability instead."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. AUTH_MODE=demo\n2. Open the Office page\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "git log --oneline -1"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Docker]
  - type: input
    id: auth
    attributes:
      label: AUTH_MODE
      placeholder: demo, api_key, gemini, meta, ...
  - type: textarea
    id: logs
    attributes:
      label: Server output or browser console (without secrets)
      render: text
