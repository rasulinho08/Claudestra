name: Feature idea
description: A new agent, skill, app, workflow or screen.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: If it sends, publishes or changes something outside the computer, it waits for approval.
